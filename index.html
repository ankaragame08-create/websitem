<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egemen Translate | Cyber Premium AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .cyber-glow-1 { animation: float-slow 8s ease-in-out infinite; }
        .cyber-glow-2 { animation: float-slow 12s ease-in-out infinite reverse; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between relative overflow-x-hidden">

    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-indigo-500/10 blur-[120px] pointer-events-none cyber-glow-1"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-purple-500/10 blur-[150px] pointer-events-none cyber-glow-2"></div>

    <nav class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center relative z-10">
        <span class="text-xl font-black tracking-widest bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent border border-indigo-500/30 px-4 py-1.5 rounded-2xl bg-slate-900/40 backdrop-blur-md shadow-[0_0_20px_-5px_rgba(99,102,241,0.3)]">
            EGEMEN.AI
        </span>
        <div class="text-xs text-cyan-400 bg-cyan-500/10 border border-cyan-500/30 px-3 py-1.5 rounded-full font-mono font-bold shadow-[0_0_15px_-3px_rgba(34,211,238,0.2)] animate-pulse">
            🌐 ONLINE AI
        </div>
    </nav>

    <main class="max-w-3xl mx-auto w-full px-6 py-12 flex-grow flex flex-col justify-center relative z-10">
        <div class="bg-slate-900/60 border border-indigo-500/30 p-6 md:p-8 rounded-[2rem] shadow-[0_0_80px_-20px_rgba(99,102,241,0.3)] backdrop-blur-xl relative overflow-hidden">
            
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-4 mb-6">
                <span class="text-xs font-black text-slate-400 tracking-widest uppercase">INPUT TEXT</span>
                <div id="algilananDilEtiketi" class="text-xs bg-gradient-to-r from-indigo-500/20 to-purple-500/20 border border-indigo-500/40 text-indigo-300 font-black px-4 py-1.5 rounded-full shadow-inner transition-all tracking-wide">
                    🤖 AI Engine Ready...
                </div>
                <span class="text-xs font-black text-slate-400 tracking-widest uppercase">TRANSLATION</span>
            </div>

            <div class="grid md:grid-cols-2 gap-6 relative">
                <div class="flex flex-col gap-2">
                    <textarea id="girisMetni" oninput="canliCeviriMotoru()" placeholder="Type in English or Spanish, the AI will handle the rest..." class="w-full h-44 bg-slate-950/70 border border-slate-800/80 rounded-2xl p-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500/50 focus:shadow-[0_0_20px_-5px_rgba(34,211,238,0.2)] transition duration-300 resize-none font-medium"></textarea>
                </div>

                <div class="flex flex-col gap-2">
                    <div id="cevirilenMetin" class="w-full h-44 bg-slate-950/40 border border-slate-800/40 rounded-2xl p-4 text-slate-500 font-semibold overflow-y-auto select-all flex items-center justify-center text-center text-xl transition-all duration-300 leading-relaxed">
                        The translation will appear here as soon as you start typing.
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="text-center py-8 text-xs text-slate-600 font-medium tracking-widest uppercase relative z-10">
        © 2026 Egemen Premium AI. All Rights Reserved.
    </footer>

    <script>
        let timeout = null;

        function canliCeviriMotoru() {
            const giris = document.getElementById("girisMetni").value.trim();
            const cikisKutusu = document.getElementById("cevirilenMetin");
            const dilEtiketi = document.getElementById("algilananDilEtiketi");

            clearTimeout(timeout);

            if (giris === "") {
                cikisKutusu.innerText = "The translation will appear here as soon as you start typing.";
                cikisKutusu.className = "w-full h-44 bg-slate-950/40 border border-slate-800/40 rounded-2xl p-4 text-slate-500 font-semibold overflow-y-auto flex items-center justify-center text-center text-xl transition-all duration-300";
                dilEtiketi.innerText = "🤖 AI Engine Ready...";
                dilEtiketi.className = "text-xs bg-gradient-to-r from-indigo-500/20 to-purple-500/20 border border-indigo-500/40 text-indigo-300 font-black px-4 py-1.5 rounded-full tracking-wide";
                return;
            }

            cikisKutusu.innerText = "Translating...";
            cikisKutusu.className = "w-full h-44 bg-slate-950/40 border border-cyan-500/20 rounded-2xl p-4 text-cyan-400 font-bold overflow-y-auto flex items-center justify-center text-center text-xl animate-pulse";

            timeout = setTimeout(() => {
                let sourceLang = "en";
                let targetLang = "es";
                
                const ispanolcaKelimeler = ["hola", "gracias", "agua", "casa", "bueno", "amigo", "playa", "sol", "el", "la", "los", "las", "y", "en", "que", "de", "buenos", "buenas", "dias", "tardes", "noches"];
                const kelimeler = giris.toLowerCase().split(/\s+/);
                const isSpanish = kelimeler.some(w => ispanolcaKelimeler.includes(w)) || /[áéíóúñ¿¡]/.test(giris);

                if (isSpanish) {
                    sourceLang = "es";
                    targetLang = "en";
                }

                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(giris)}`;

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data[0] && data[0][0] && data[0][0][0]) {
                            const translatedText = data[0].map(s => s[0]).join("");
                            cikisKutusu.innerText = translatedText;
                            cikisKutusu.className = "w-full h-44 bg-slate-950/50 border border-emerald-500/30 rounded-2xl p-4 text-emerald-400 text-2xl font-extrabold overflow-y-auto flex items-center justify-center text-center shadow-[0_0_30px_-5px_rgba(16,185,129,0.2)]";
                            
                            dilEtiketi.innerText = sourceLang === "en" ? "🇬🇧 EN ➔ 🇪🇸 ES" : "🇪🇸 ES ➔ 🇬🇧 EN";
                            dilEtiketi.className = "text-xs bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 font-black px-4 py-1.5 rounded-full tracking-widest";
                        } else {
                            cikisKutusu.innerText = "Translation error.";
                        }
                    })
                    .catch(error => {
                        console.error(error);
                        cikisKutusu.innerText = "Connection lost.";
                    });
            }, 400);
        }
    </script>
</body>
</html>
